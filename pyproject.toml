[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-intel"
version = "1.0.0"
description = "NLP pipeline for support-ticket routing, extractive summarization, and insight extraction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian Callahan" }]
keywords = ["nlp", "text-classification", "tf-idf", "naive-bayes", "fastapi", "streamlit"]

# Lower-bound constraints by design: Dependabot manages upgrades, and hard pins
# would fight it. The CI matrix is the source of truth for an exact environment.
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "plotly>=6.7.0",
    "streamlit>=1.28.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.24", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/CCallahan308/ticket-intel"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
